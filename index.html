<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中川村マップ_デモ用</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Sans",sans-serif}
#map,#map2{position:absolute;inset:0}
#map2{mix-blend-mode:multiply;pointer-events:none;display:none}
#panel{position:absolute;top:10px;left:10px;background:#fff;border-radius:8px;box-shadow:0 1px 6px #0004;padding:10px 12px;font-size:13px;max-width:280px}
#panel h1{font-size:15px;margin:0 0 6px}
#panel label{display:block;margin:3px 0;cursor:pointer}
#panel .sec{margin-top:8px;font-weight:bold;color:#555}
#panel input[type=range]{width:100%}
#panel.min .body{display:none}
#tg{float:right;cursor:pointer;color:#06c}
#msg{position:absolute;bottom:34px;right:10px;background:#333e;color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;display:none;max-width:240px}
#attr{position:absolute;bottom:0;right:0;background:#fffc;font-size:10px;padding:1px 4px}
</style></head><body>
<div id="map"></div><div id="map2"></div>
<div id="panel"><span id="tg">隠す</span><h1>中川村マップ_デモ用</h1>
<div class="body">
<div class="sec">レイヤ</div>
<label><input type="radio" name="mul" value="" checked>地理院地図</label>
<label><input type="radio" name="mul" value="cs">CS立体図</label>
<label><input type="radio" name="mul" value="now">最新の航空写真</label>
<label><input type="radio" name="mul" value="a70">1970年代の写真</label>
<label><input type="radio" name="mul" value="a60">1960年代の写真</label>
<div>濃さ <input type="range" id="mop" min="0.1" max="1" step="0.05" value="1"></div>
<div class="sec">表示</div>
<label><input type="checkbox" id="t3d">3D表示（10mメッシュ標高）</label>
<div id="t3dop" style="display:none">高さの強調 <input type="range" id="t3dex" min="1" max="3" step="0.5" value="1.5"></div>
<label><input type="checkbox" id="mask" checked>村外を暗くする</label>
<label><input type="checkbox" id="towns" checked>地区名</label>
</div></div>
<div id="msg"></div>
<div id="attr">出典：長野県CS立体図（G空間情報センター）、国土地理院（空中写真）、OpenStreetMap（村境）</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const G='https://cyberjapandata.gsi.go.jp/xyz/';
const src=(p,ext='png',max=18)=>({type:'raster',tiles:[G+p+'/{z}/{x}/{y}.'+ext],tileSize:256,maxzoom:max,attribution:'国土地理院'});
let boundaryGeom=null;
const map=new maplibregl.Map({container:'map',center:[137.97,35.64],zoom:11.5,
 style:{version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
 sources:{pale:src('pale','png',18)},
 layers:[{id:'pale',type:'raster',source:'pale'}]}});
map.addControl(new maplibregl.NavigationControl());
map.addControl(new maplibregl.ScaleControl({unit:'metric'}));
const geo=new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true,timeout:15000},trackUserLocation:true,fitBoundsOptions:{maxZoom:15}});
map.addControl(geo,'top-right');
let mt;const say=t=>{const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(mt);mt=setTimeout(()=>m.style.display='none',6000)};
geo.on('error',e=>say(e.code===1?'位置情報が許可されていません':e.code===3?'現在地の取得がタイムアウトしました':'現在地を取得できませんでした'));
geo.on('geolocate',e=>{const g=boundaryGeom;if(g){const ll=[e.coords.longitude,e.coords.latitude];const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
 const inside=polys.some(p=>{const r=p[0];let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){if((r[i][1]>ll[1])!==(r[j][1]>ll[1])&&ll[0]<(r[j][0]-r[i][0])*(ll[1]-r[i][1])/(r[j][1]-r[i][1])+r[i][0])c=!c}return c});
 if(!inside)say('現在地は中川村の外です（精度 約'+Math.round(e.coords.accuracy)+'m）')}});
map.on('load',async()=>{
 const b=await (await fetch('data/boundary.geojson')).json();
 const t=await (await fetch('data/towns.geojson')).json();
 const ring=b.features[0].geometry;boundaryGeom=ring; const rings=ring.type==='Polygon'?[ring.coordinates[0]]:ring.coordinates.map(p=>p[0]);
 map.addSource('mask',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[[[130,30],[145,30],[145,45],[130,45],[130,30]],...rings]}}});
 map.addSource('bd',{type:'geojson',data:b});
 map.addSource('towns',{type:'geojson',data:t});
 map.addLayer({id:'mask',type:'fill',source:'mask',paint:{'fill-color':'#000','fill-opacity':0.45}});
 map.addLayer({id:'bd',type:'line',source:'bd',paint:{'line-color':'#d22','line-width':2.5,'line-dasharray':[3,2]}});
 map.addLayer({id:'towns',type:'symbol',source:'towns',layout:{'text-field':['get','name'],'text-font':['Open Sans Regular'],'text-size':16},paint:{'text-color':'#222','text-halo-color':'#fff','text-halo-width':2}});
 const bb=new maplibregl.LngLatBounds();rings.flat().forEach(c=>bb.extend(c));
 map.fitBounds(bb,{padding:30,animation:false});
});

/* 乗算レイヤ：同じ視点の2枚目の地図をCSSのmultiplyで重ねる */
const ids=['cs','a60','a70','now'];
const map2=new maplibregl.Map({container:'map2',center:[137.97,35.64],zoom:11.5,interactive:false,attributionControl:false,
 style:{version:8,sources:{
  cs:{type:'raster',tiles:['https://tile.geospatial.jp/CS/VER2/{z}/{x}/{y}.png'],tileSize:256,maxzoom:17},
  a60:src('ort_old10','png',17),a70:src('gazo1','jpg',17),now:src('seamlessphoto','jpg',18)},
 layers:ids.map(i=>({id:i,type:'raster',source:i,layout:{visibility:'none'}}))}});
let mulOn=false,last='';
const sync=(force)=>{if(!mulOn)return;const c=map.getCenter(),k=[c.lng,c.lat,map.getZoom(),map.getBearing(),map.getPitch()].join();
 if(!force&&k===last)return;last=k;map2.jumpTo({center:c,zoom:map.getZoom(),bearing:map.getBearing(),pitch:map.getPitch()})};
map.on('move',()=>sync());map.on('resize',()=>{if(mulOn){map2.resize();sync(true)}});
document.querySelectorAll('[name=mul]').forEach(r=>r.onchange=()=>{
 const on=r.value!=='';mulOn=on;document.getElementById('map2').style.display=on?'block':'none';
 if(on){map2.resize();if(typeof setTerrain2==='function')setTerrain2();sync(true)}else if(typeof setTerrain2==='function')setTerrain2()
 ids.forEach(i=>map2.setLayoutProperty(i,'visibility',r.value===i?'visible':'none'))});
document.getElementById('mop').oninput=e=>document.getElementById('map2').style.opacity=e.target.value;

/* 3D表示：国土地理院の標高タイル(dem_png=10mメッシュ)をterrarium形式に変換して地形にする */
(()=>{const N=256,ZMAX=14;let cv=null;
 const enc=h=>{const v=Math.round((h+32768)*256);return [(v>>16)&255,(v>>8)&255,v&255]};
 const cache=new Map();
 async function tile(z,x,y){
  const key=z+'/'+x+'/'+y;
  if(!cache.has(key)){cache.set(key,tile0(z,x,y));if(cache.size>300)cache.delete(cache.keys().next().value)}
  return (await cache.get(key)).slice(0)}
 async function tile0(z,x,y){
  if(!cv){cv=document.createElement('canvas');cv.width=cv.height=N}
  const ctx=cv.getContext('2d',{willReadFrequently:true});const out=ctx.createImageData(N,N);let data=null;
  try{const r=await fetch(G+'dem_png/'+z+'/'+x+'/'+y+'.png');
   if(r.ok){const bm=await createImageBitmap(await r.blob(),{colorSpaceConversion:'none',premultiplyAlpha:'none'});
    ctx.clearRect(0,0,N,N);ctx.drawImage(bm,0,0);data=ctx.getImageData(0,0,N,N).data}}catch(e){}
  const flat=enc(0);
  for(let i=0;i<N*N;i++){let rgb=flat;
   if(data&&data[4*i+3]>0){const q=data[4*i]*65536+data[4*i+1]*256+data[4*i+2];
    if(q<8388608)rgb=enc(q*0.01);else if(q>8388608)rgb=enc((q-16777216)*0.01)}
   out.data[4*i]=rgb[0];out.data[4*i+1]=rgb[1];out.data[4*i+2]=rgb[2];out.data[4*i+3]=255}
  ctx.putImageData(out,0,0);
  return (await new Promise(r=>cv.toBlob(r,'image/png'))).arrayBuffer()}
 maplibregl.addProtocol('gsidem',async p=>{const m=p.url.match(/^gsidem:\/\/(\d+)\/(\d+)\/(\d+)/);return {data:await tile(+m[1],+m[2],+m[3])}});
 const DEM={type:'raster-dem',tiles:['gsidem://{z}/{x}/{y}'],tileSize:N,maxzoom:ZMAX,encoding:'terrarium',attribution:'標高：国土地理院'};
 const ready=m=>new Promise(r=>m.isStyleLoaded()?r():m.once('load',r));
 const chk=document.getElementById('t3d'),ex=document.getElementById('t3dex'),box=document.getElementById('t3dop');
 async function apply(){
  await Promise.all([ready(map),ready(map2)]);
  for(const m of [map,map2])if(!m.getSource('dem3d'))m.addSource('dem3d',DEM);
  const e=+ex.value;
  if(chk.checked){map.setTerrain({source:'dem3d',exaggeration:e});if(mulOn)map2.setTerrain({source:'dem3d',exaggeration:e});
   map.setMaxPitch(80);map2.setMaxPitch(80);
   if(map.getPitch()<30)map.easeTo({pitch:60,bearing:-20,duration:900})}
  else{map.setTerrain(null);map2.setTerrain(null);map.easeTo({pitch:0,bearing:0,duration:600})}}
 window.setTerrain2=async()=>{await ready(map2);if(!map2.getSource('dem3d'))map2.addSource('dem3d',DEM);
  if(mulOn&&chk.checked)map2.setTerrain({source:'dem3d',exaggeration:+ex.value});else map2.setTerrain(null)};
 chk.onchange=()=>{box.style.display=chk.checked?'block':'none';apply()};
 ex.oninput=()=>{if(chk.checked)apply()};
})();
const vis=(id,on)=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none');
[['mask','mask'],['towns','towns']].forEach(([i,l])=>document.getElementById(i).onchange=e=>vis(l,e.target.checked));
document.getElementById('tg').onclick=e=>{const p=document.getElementById('panel');p.classList.toggle('min');e.target.textContent=p.classList.contains('min')?'表示':'隠す'};
</script></body></html>
